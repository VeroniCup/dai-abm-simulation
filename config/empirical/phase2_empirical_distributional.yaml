# Opt-in Phase 2 Tranche B empirical configuration.
# This reproduces the Tranche A scalar values and explicitly selects
# distribution-aware empirical joint vault initialisation.

bundle_name: phase2_empirical_distributional
mode: empirical_tranche_b
description: "Opt-in Tranche B distribution-aware empirical vault initialisation."
source_manifest: config/empirical/tranche_a_manifest.json

simulation:
  n_vaults: 500  # Phase 2B; configuration_ready_with_sensitivity; synthetic population scale.

collateral_portfolio:
  name: phase2_empirical_eth_wbtc
  target_debt_shares:
    ETH: 0.8483941126796408  # Phase 2B; share of sampled system debt.
    BTC: 0.1516058873203592  # Phase 2B; share of sampled system debt.
  compatibility_defaults:
    initial_prices:
      ETH: 2000.0  # Current simulator compatibility value; not a Tranche B estimate.
      BTC: 30000.0  # Current simulator compatibility value; not a Tranche B estimate.

liquidation:
  max_close_factor: 1.0  # Phase 2C protocol-close compatibility scalar.

confidence:
  normal_lower_price: 0.9992875  # Tranche A scalar threshold.
  normal_upper_price: 1.0030259166666666  # Tranche A scalar threshold.
  stress_lower_price: 0.9967380166666668  # Tranche A scalar threshold.
  max_normal_liquidatable_share: 0.0  # Tranche A scalar threshold; population interaction is diagnostic only.

vault_initialisation:
  mode: empirical_joint
  seed: 20260726
  regime: normal
  pool_path: config/empirical/data/vault_initialisation_pools.csv
  pool_sha256: 5230a30aa2c2aebe69ef859ccdcbb785eb44f20a691b431f2fd01b0d16558892
  fallback: parametric_truncated
  by_ilk: true
  minimum_exact_ilk_pool_size: 50
  allow_initial_liquidatable: false
  sample_with_replacement: true
  max_sampling_attempts: 10000
  parametric:
    ETH:
      debt_log_mean: 8.65354030935
      debt_log_std: 3.53348308692
      buffer_log_mean: 1.47052927003
      buffer_log_std: 1.48950522112
      liquidation_ratio: 1.45
      minimum_debt: 1.0
      maximum_debt: 150000000.0
      minimum_buffer: 0.0
      maximum_buffer: 4000.0
    WBTC:
      debt_log_mean: 10.8911793514
      debt_log_std: 2.18504087003
      buffer_log_mean: 0.57929751143
      buffer_log_std: 0.902220725342
      liquidation_ratio: 1.75
      minimum_debt: 1.0
      maximum_debt: 30000000.0
      minimum_buffer: 0.0
      maximum_buffer: 100.0

provenance:
  candidate_status: audited_tranche_b_distributional_initialisation
  legacy_defaults_preserved: true
  tranche_a_values_preserved: true
  later_interface_work_may_supersede: true
