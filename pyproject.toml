[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dai-abm-simulation"
version = "0.1.0a0"
description = "Agent-based simulation of DAI stability under market stress"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "setuptools>=68",
]
lint = [
    "ruff>=0.14",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dai_sim*"]
